  services:
    mongo:
      image: mongodb/mongodb-community-server:latest
      container_name: mongo
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db

    user-service:
      build: ./user-service
      container_name: user-service
      ports:
        - "3001:3001"
      depends_on:
        - mongo
    
    rabbitmq:
      image: rabbitmq:3-management
      container_name: rabbitmq
      ports:
        - "5673:5673"     # running on
        - "15672:15672"   # web interface for rabbitmq

    task-service:
      build: ./task-service
      container_name: task-service
      ports:
        - "3002:3002"
      depends_on:
        - mongo
        - rabbitmq

    notification-service:
      build: ./notification-service
      container_name: notification-service
      ports:
        - "3003:3003"
      depends_on:
        - mongo
        - rabbitmq

   
  volumes:
    mongo_data: